[project]
name = "crypto-arena-backend"
version = "1.0.0"
description = "Crypto Arena API - virtual crypto trading simulation (FastAPI + PostgreSQL + CoinGecko)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
