# Blueprint Render : backend FastAPI + PostgreSQL managé.
# Le frontend est déployé séparément sur Vercel/Netlify (voir README > Déploiement).
services:
  - type: web
    name: crypto-arena-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: AUTO_INIT_DB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-arena-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COINGECKO_API_KEY
        sync: false            # à renseigner dans le dashboard Render (jamais dans le dépôt)
      - key: CORS_ORIGINS
        value: https://VOTRE-FRONTEND.vercel.app   # URL publique du frontend, sans slash final

databases:
  - name: crypto-arena-db
    plan: free
    databaseName: crypto_arena
    user: crypto_arena
