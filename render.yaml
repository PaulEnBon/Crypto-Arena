# Blueprint Render : backend FastAPI uniquement, sur l'instance GRATUITE.
# La base PostgreSQL est hébergée sur Neon (offre gratuite sans expiration), pas sur Render.
# Le frontend est déployé séparément sur Vercel (voir README > Déploiement).
services:
  - type: web
    name: crypto-arena-api
    runtime: python
    plan: free                 # obligatoire : sans ce champ, Render crée une instance payante
    region: frankfurt          # même région que la base Neon (aws-eu-central-1) pour limiter la latence
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: AUTO_INIT_DB
        value: "true"
      - key: DATABASE_URL
        sync: false            # URL Neon DIRECTE (hôte sans "-pooler"), saisie dans le dashboard Render
      - key: JWT_SECRET
        generateValue: true
      - key: COINGECKO_API_KEY
        sync: false            # à renseigner dans le dashboard Render (jamais dans le dépôt)
      - key: NEON_AUTH_URL        # connexion Google / GitHub : "Auth URL" de la branche Neon (non secrète)
        value: https://ep-sparkling-thunder-b26m0jyi.neonauth.c-6.eu-central-1.aws.neon.tech/neondb/auth
      - key: CORS_ORIGINS
        value: https://VOTRE-FRONTEND.vercel.app   # URL publique du frontend, sans slash final
